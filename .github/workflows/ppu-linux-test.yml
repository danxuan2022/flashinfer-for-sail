# PPU test pipeline (pull_request-triggered).
#
# This is the PPU counterpart of pr-test.yml, reduced to ONLY the
# "GPU JIT Tests - H100 (Hopper) - Capacity Block" part, i.e. the unit-test
# suite that scripts/task_run_unit_tests.sh runs on H100. Here it runs on a
# ZhenWu 810E PPU (ppu001) instead of an H100.
#
# Dependency on the build (pull_request trigger => build and test start together):
#   - The wheel is NOT rebuilt here. It is produced by ppu-linux-build.yml and
#     uploaded as the artifact "flashinfer-for-sail-wheel-<run_number>".
#   - Both workflows trigger on the same pull_request to v0.6.12, so they run in
#     parallel. To still consume the build's wheel, this job POLLS the Actions
#     API for the sibling "PPU Linux Build" run sharing this PR's head SHA
#     (github.sha == the PR merge commit, identical for both runs), waits for it
#     to complete, then downloads its wheel by run id.
#   - Trade-off vs workflow_run: the test job blocks for as long as the build
#     takes (up to WAIT_TIMEOUT_MINUTES). Keep paths-ignore in sync with the
#     build so docs-only PRs skip BOTH, otherwise we would wait on a build that
#     never runs.
#
# Execution model (flytiger-eco/ppu-distributed-action):
#   - The job runs on a CPU-only orchestration runner (zero PPU occupancy).
#   - actions/checkout puts the source in $GITHUB_WORKSPACE; the action tars it
#     to NAS and unpacks it into source_dir (/workspace/source) inside the PPU
#     worker pod before running `command`.
#   - artifact_paths stages the downloaded wheel into the pod alongside source,
#     so it lands at /workspace/source/wheelhouse/.
#   - `command` then installs the wheel (NOT editable source) and runs pytest.

name: PPU Linux Test

on:
  pull_request:
    branches: [v0.6.12]
    types: [opened, synchronize, reopened, ready_for_review]
    # Keep identical to ppu-linux-build.yml so a skipped build is never waited on.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker/**'
      - 'licenses/**'
      - 'benchmarks/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'PPU Linux Build run ID to download the wheel from'
        required: true
        type: string

# A newer push to the same PR supersedes the stale run (and its build wait).
concurrency:
  group: ppu-linux-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # PPU worker pod image (SGLang-for-SAIL, ships the PPU torch runtime). Kept
  # separate from the build image on purpose: tests validate the wheel against
  # the runtime image users actually deploy.
  PPU_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
  # Where the action unpacks the staged source inside the PPU pod.
  PPU_SOURCE_DIR: /workspace/source

jobs:
  ppu-test-810e:
    name: PPU Test (810E, H100 unit tests)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # Covers the build wait (up to WAIT_TIMEOUT_MINUTES) plus the PPU test run.
    # Self-hosted runner, so exceeding the 6h hosted cap is allowed.
    timeout-minutes: 720
    steps:
      # pull_request: build and test fire together, so WAIT for the sibling
      # "PPU Linux Build" run on this PR's head SHA to finish, then use its id to
      # download the wheel. Polls the Actions API with curl (present in the
      # actions-runner image; jq/python/gh are not guaranteed there). head_sha is
      # github.sha == the PR merge commit, identical for the build and test runs.
      - name: Wait for PPU Linux Build (PR)
        id: waitbuild
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS_API: https://api.github.com/repos/${{ github.repository }}/actions/workflows/ppu-linux-build.yml/runs
          HEAD_SHA: ${{ github.sha }}
          WAIT_TIMEOUT_MINUTES: '360'
          WAIT_INTERVAL_SECONDS: '60'
        # NOTE: this runner has no bash on PATH, so GitHub falls back to sh
        # (dash) for `run:` steps. Keep the script POSIX-compatible: no
        # `set -o pipefail` (dash rejects it); every pipeline ends in `|| true`
        # so failures are handled explicitly instead of via pipefail.
        run: |
          set -eu
          deadline=$(( $(date +%s) + WAIT_TIMEOUT_MINUTES * 60 ))
          echo "Waiting for a 'PPU Linux Build' run with head_sha=${HEAD_SHA} to complete..."
          while true; do
            resp="$(curl -sfL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${RUNS_API}?head_sha=${HEAD_SHA}&per_page=1" || true)"

            run_id="$(printf '%s' "${resp}" | grep -o '"id":[[:space:]]*[0-9]\{1,\}' | head -1 | grep -o '[0-9]\{1,\}' || true)"
            status="$(printf '%s' "${resp}" | grep -o '"status":[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || true)"
            conclusion="$(printf '%s' "${resp}" | grep -o '"conclusion":[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || true)"

            if [ -n "${run_id}" ] && [ "${status}" = "completed" ]; then
              echo "Build run ${run_id} completed (conclusion=${conclusion:-none})."
              if [ "${conclusion}" = "success" ]; then
                echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::PPU Linux Build run ${run_id} did not succeed (conclusion=${conclusion:-none}); nothing to test."
              exit 1
            fi

            if [ -n "${run_id}" ]; then
              echo "Build run ${run_id} is '${status:-pending}'; retrying in ${WAIT_INTERVAL_SECONDS}s..."
            else
              echo "No 'PPU Linux Build' run for head_sha=${HEAD_SHA} yet; retrying in ${WAIT_INTERVAL_SECONDS}s..."
            fi

            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out after ${WAIT_TIMEOUT_MINUTES}m waiting for PPU Linux Build (head_sha=${HEAD_SHA})."
              exit 1
            fi
            sleep "${WAIT_INTERVAL_SECONDS}"
          done

      # workflow_dispatch: the run id is supplied directly, so no waiting needed.
      - name: Resolve build run (dispatch)
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_RUN_ID: ${{ github.event.inputs.build_run_id }}
        run: |
          set -eu
          if ! [ "${INPUT_RUN_ID}" -gt 0 ] 2>/dev/null; then
            echo "::error::Invalid build_run_id: '${INPUT_RUN_ID}'"
            exit 1
          fi
          echo "run_id=${INPUT_RUN_ID}" >> "$GITHUB_OUTPUT"

      # The source tree the PPU pod will run tests from (staged by the action).
      # For pull_request this checks out the PR merge commit (github.sha) - the
      # exact tree the sibling build compiled the wheel from, so they match.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # actions/download-artifact@v4 can only read artifacts of the SAME run, so
      # use dawidd6/action-download-artifact to pull the wheel from the build
      # run. The artifact name embeds the build's run_number (unknown here), so
      # match it with a regexp.
      - name: Download wheel from build run
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.waitbuild.outputs.run_id || steps.dispatch.outputs.run_id }}
          name: flashinfer-for-sail-wheel-.*
          name_is_regexp: true
          path: wheelhouse
          if_no_artifact_found: error

      - name: Show downloaded wheel
        run: |
          echo "=== wheelhouse ==="
          find wheelhouse -type f -print

      # Submit the test job to a single 810E PPU (1 card) and run the H100
      # unit-test suite against the downloaded wheel. nnodes: 0 => single node.
      - name: Run H100 unit tests on 810E PPU
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=OAM-810E"
          host_volumes: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
          image: ${{ env.PPU_IMAGE }}
          source_dir: ${{ env.PPU_SOURCE_DIR }}
          artifact_paths: wheelhouse
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            set -euo pipefail
            echo '=== PPU Verification ==='
            echo "Hostname: $(hostname), Node: ${NODE_NAME:-}"
            echo "RANK=${RANK:-} NODE_RANK=${NODE_RANK:-} WORLD_SIZE=${WORLD_SIZE:-} NPROC_PER_NODE=${NPROC_PER_NODE:-}"
            ppu-smi || true
            cd "${PPU_SOURCE_DIR:-/workspace/source}"
            echo '--- source tree ---'
            ls -al

            # Locate the wheel staged from the build run and install it.
            # --no-deps --force-reinstall: do NOT pull requirements.txt (it pins
            # torch and would clobber the PPU runtime baked into this image);
            # just install the compiled flashinfer-for-sail wheel over any
            # preinstalled copy. This mirrors the README offline-install path.
            WHEEL=$(ls -t wheelhouse/*/*.whl 2>/dev/null | head -n 1 || true)
            if [ -z "$WHEEL" ]; then
              echo "ERROR: no wheel found under wheelhouse/" >&2
              find wheelhouse -type f -print || true
              exit 1
            fi
            echo "Installing wheel: $WHEEL"
            pip install --no-deps --force-reinstall "$WHEEL"

            # Verify the install before spending PPU time on the suite.
            python -c "import flashinfer; print('flashinfer', flashinfer.__version__)"
            python -m flashinfer show-config || true

            # The PPU image ships pytest via SGLang; install it only if missing
            # (again without touching torch).
            python -c "import pytest" 2>/dev/null || pip install --no-deps pytest

            # H100 "Capacity Block" suite == scripts/task_run_unit_tests.sh's
            # auto-discovered tests/ run. pytest.ini's norecursedirs applies
            # automatically; single PPU => sequential execution.
            echo '=== Run unit tests (H100 suite) ==='
            pytest --continue-on-collection-errors tests/
            echo '=== DONE ==='

      - name: Test Summary
        if: "!cancelled()"
        run: |
          {
            echo "## PPU Linux Test"
            echo "- Board: \`OAM-810E\` (1 PPU)"
            echo "- Image: \`${PPU_IMAGE}\`"
            echo "- Build run: \`${{ steps.waitbuild.outputs.run_id || steps.dispatch.outputs.run_id }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Status: Passed"
            else
              echo "- Status: ${{ job.status }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
