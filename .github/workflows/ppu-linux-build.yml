# PPU build pipeline.
# Compiles flashinfer-for-sail (AOT) inside the PPU build container and
# produces an installable wheel.
#
# Triggered on push / PR to v0.6.12 and manually via workflow_dispatch.
# The code under test is the current checkout (not a fixed clone), so PRs
# validate their own changes.

name: PPU Linux Build

on:
  push:
    branches: [v0.6.12]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker/**'
      - 'licenses/**'
      - 'benchmarks/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [v0.6.12]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker/**'
      - 'licenses/**'
      - 'benchmarks/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      cuda_arch_list:
        description: 'Target CUDA arch list (TORCH_CUDA_ARCH_LIST / FLASHINFER_CUDA_ARCH_LIST)'
        type: string
        default: '8.0'

concurrency:
  group: ppu-linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-sglang0.5.13-py312
  CUDA_ARCH_LIST: ${{ github.event.inputs.cuda_arch_list || '8.0' }}

jobs:
  build:
    name: PPU Build (wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Cleanup
        run: |
          # Stop leftover containers from previous runs to free memory
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          # Clean workspace and JIT cache
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          # The build image plus AOT objects need far more space than a
          # hosted runner offers by default; drop unused preinstalled SDKs.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Node Info
        run: |
          echo "===== RUNNER INFO ====="
          echo "runner: ${{ runner.name }} (${{ runner.environment }})"
          echo "run number: ${{ github.run_number }}"
          echo "workspace: ${{ github.workspace }}"
          df --human-readable
          nproc
          free -h
          nvidia-smi 2>/dev/null || echo "no gpu on build node"

      - name: Build Wheel
        run: |
          bash ci/bash.sh "${IMAGE_NAME}" \
            -e TORCH_CUDA_ARCH_LIST "${CUDA_ARCH_LIST}" \
            -e FLASHINFER_CUDA_ARCH_LIST "${CUDA_ARCH_LIST}" \
            --no-gpu ./scripts/task_ppu_build_wheel.sh

      - name: Upload Wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-for-sail-wheel-${{ github.run_number }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        if: "!cancelled()"
        run: |
          echo "## PPU Linux Build" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Arch list: \`${CUDA_ARCH_LIST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "- Status: Passed" >> $GITHUB_STEP_SUMMARY
            for whl in dist/*.whl; do
              [ -e "$whl" ] && echo "- Wheel: \`$(basename "$whl")\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "- Status: Failed" >> $GITHUB_STEP_SUMMARY
          fi
